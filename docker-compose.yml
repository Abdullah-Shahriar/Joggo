services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicshield}
      POSTGRES_DB: ${POSTGRES_DB:-clinicshield}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicshield} -d ${POSTGRES_DB:-clinicshield}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-JOGGO}
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://clinicshield:clinicshield@db:5432/clinicshield}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-chars-minimum}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,groq}
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
      OCR_LANGS: ${OCR_LANGS:-eng+ben}
      DATE_ORDER: ${DATE_ORDER:-DMY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-30}
      VAULT_IDLE_MINUTES: ${VAULT_IDLE_MINUTES:-30}
      VAULT_ABSOLUTE_HOURS: ${VAULT_ABSOLUTE_HOURS:-8}
      VAULT_MAX_MB: ${VAULT_MAX_MB:-300}
      PIPELINE_MAX_WORKERS: ${PIPELINE_MAX_WORKERS:-}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      AUDITOR_SEED_EMAIL: ${AUDITOR_SEED_EMAIL:-}
      AUDITOR_SEED_PASSWORD: ${AUDITOR_SEED_PASSWORD:-}
      DOCTOR_SEED_EMAIL: ${DOCTOR_SEED_EMAIL:-}
      DOCTOR_SEED_PASSWORD: ${DOCTOR_SEED_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
